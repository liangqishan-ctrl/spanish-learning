<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听见南美 · 初级听力18课</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#183d35;font:17px/1.8 system-ui}header{max-width:1100px;margin:auto;padding:35px 22px}h1{font-size:clamp(32px,6vw,52px);margin:8px 0}small,.muted{color:#607a70}main{max-width:1100px;margin:auto;padding:0 20px 50px;display:grid;grid-template-columns:260px 1fr;gap:22px}aside,article{background:white;border-radius:22px;padding:24px}aside{background:#e8eee2;align-self:start}button,select{font:inherit;color:inherit;border:1px solid #ccd8ca;border-radius:10px;background:white;padding:11px 15px;cursor:pointer}button:hover{border-color:#17664e}button:focus-visible{outline:3px solid #dc9c3e}.primary,.active{background:#17664e!important;color:white}nav{display:grid;gap:6px;margin-top:18px}nav button{text-align:left;font-size:14px;border:0;background:transparent;padding:8px}h2{font-size:28px;margin:10px 0}.player{background:#eff4eb;padding:20px;border-radius:15px}.controls{display:flex;gap:8px;flex-wrap:wrap}fieldset{border:0;padding:0;margin:24px 0}legend{font-weight:bold}.option{display:block;width:100%;text-align:left;margin-top:8px}.selected{border:2px solid #17664e;background:#ecf4e8}.correct{border:2px solid #218656;background:#e7f4e6}.wrong{border:2px solid #b45546;background:#ffede7}button:disabled{cursor:default}#reveal{margin-top:20px}.spanish{font-size:21px;line-height:1.9}ul{padding-left:22px}.foot{display:flex;justify-content:space-between;margin-top:25px;gap:10px}progress{width:100%;accent-color:#17664e}.mobile{display:none}details{font-size:13px;margin-top:24px;border-top:1px solid #ddd;padding-top:15px}#status{font-size:14px;min-height:25px}.settings{font-size:13px;margin-top:15px}select{max-width:100%;font-size:14px}footer{max-width:1100px;padding:10px 22px 30px;margin:auto;font-size:12px;color:#61766d}@media(max-width:740px){main{display:block;padding:0 12px 30px}aside{padding:14px 18px;margin-bottom:15px}nav{display:none}.mobile{display:block;width:100%}article{padding:20px 17px}header{padding:25px 18px}header p{font-size:14px}.controls button{flex:1;padding:10px 7px}}</style><header><small>ESCUCHA · APRENDE · HABLA</small><h1>听见南美<span style="color:#c28436">。</span></h1><p>18课初级西班牙语听力 · 先听 → 答题 → 看原文与词汇</p></header><main><aside><b>第一季 · 生活里的短对话</b><p id="count"></p><progress id="progress" max="18"></progress><select class="mobile" id="mobile" aria-label="选择课程"></select><nav id="nav"></nav><small>进度仅保存在本设备浏览器。</small></aside><article id="app">正在载入课程……</article></main><footer>原创教学对话 · 场景中的人名、地点与价格为练习设定。<br>［训练事实｜高］南美表达有地区差异；本课穿插阿根廷常见说法，并在词汇中标明。</footer><script>
let lessons=[],current=0,answers=[],done=false,voices=[],utterance,history={};const $=s=>document.getElementById(s);try{history=JSON.parse(localStorage.getItem('sur18')||'{}')}catch{}function stop(){if(window.speechSynthesis)speechSynthesis.cancel()}function sidebar(){let n=Object.keys(history).length;$('count').textContent=`已练习 ${n} / 18 课`;$('progress').value=n;$('nav').innerHTML=lessons.map((l,i)=>`<button class="${i===current?'active':''}" onclick="openLesson(${i})">${String(i+1).padStart(2,'0')}　${l.title} ${history[i]?'✓':''}</button>`).join('');$('mobile').innerHTML=lessons.map((l,i)=>`<option value="${i}" ${i===current?'selected':''}>${i+1}. ${l.title} ${history[i]?'✓':''}</option>`).join('')}function openLesson(i){stop();current=i;answers=[];done=false;sidebar();let l=lessons[i];$('app').innerHTML=`<small>LECCIÓN ${String(i+1).padStart(2,'0')} / 18</small><h2>${l.title}</h2><div class="player"><div class="controls"><button class="primary" onclick="play(.88)">▶ 播放</button><button onclick="play(.65)">慢速重听</button><button onclick="stop();$('status').textContent='已停止'">■ 停止</button></div><div class="settings"><label>语音 <select id="voice" aria-label="朗读语音"></select></label></div><div id="status" role="status">先听两遍，再选择答案。</div></div>${l.questions.map((q,j)=>`<fieldset><legend>${j+1}. ${q.q}</legend>${q.options.map((v,k)=>`<button aria-pressed="false" class="option" id="q${j}-${k}" onclick="choose(${j},${k})">${'ABC'[k]}　${v}</button>`).join('')}</fieldset>`).join('')}<button class="primary" id="submit" onclick="submit()">提交答案 · 查看讲解</button><p id="feedback" role="status"></p><div id="reveal"></div><div class="foot"><button onclick="openLesson(${i-1})" ${i===0?'disabled':''}>← 上一课</button><button onclick="openLesson(${i+1})" ${i===17?'disabled':''}>下一课 →</button></div><details><summary>学习建议与播放说明</summary><p>先听两遍，答完跟读一遍。明天先复习上一课，再学新课。</p><p>语音由设备合成，优先使用拉美西语，并非真人录音，也不保证南美口音。若无声，请关闭手机静音并调高媒体音量；也可在系统中下载西语语音。语音列表取决于设备。</p></details>`;fillVoices()}function choose(j,k){if(done)return;answers[j]=k;lessons[current].questions[j].options.forEach((_,n)=>{let b=$(`q${j}-${n}`);b.classList.toggle('selected',n===k);b.setAttribute('aria-pressed',n===k)})}function submit(){let l=lessons[current];if(l.questions.some((_,j)=>answers[j]===undefined)){$('feedback').textContent='请先完成两道题。';return}done=true;let score=0;l.questions.forEach((q,j)=>{if(answers[j]===q.answer)score++;q.options.forEach((_,k)=>{let b=$(`q${j}-${k}`);b.disabled=true;if(k===q.answer)b.classList.add('correct');else if(k===answers[j])b.classList.add('wrong')})});history[current]={score};try{localStorage.setItem('sur18',JSON.stringify(history))}catch{}sidebar();$('submit').disabled=true;$('feedback').textContent=`答对 ${score} / 2 题。绿色为正确答案。看原文再听一次吧。`;$('reveal').innerHTML=`<hr><h3>对话原文</h3><p class="spanish" lang="es">${l.text}</p><button onclick="copyText()">复制原文</button><h3>中文释义</h3><p>${l.zh}</p><h3>词汇与短句</h3><ul>${l.vocab.map(v=>`<li>${v}</li>`).join('')}</ul><small>［训练事实｜高］以上为本课语境中的词句释义。</small><p><button onclick="openLesson(current)">重新练习</button></p>`}function fillVoices(){if(!window.speechSynthesis)return;voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es'));let el=$('voice');if(el)el.innerHTML='<option value="-1">自动选择拉美西语</option>'+voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('')}function play(rate){if(!window.speechSynthesis){$('status').textContent='浏览器不支持朗读，请换用支持系统语音的浏览器。';return}stop();utterance=new SpeechSynthesisUtterance(lessons[current].text);let v=voices[+$('voice').value]||voices.find(v=>/es-(AR|UY|CL|CO|PE)/i.test(v.lang))||voices.find(v=>/es-MX/i.test(v.lang))||voices.find(v=>!/es-ES/i.test(v.lang))||voices[0];utterance.lang=v?v.lang:'es-AR';if(v)utterance.voice=v;utterance.rate=rate;utterance.onstart=()=>{$('status').textContent='正在播放……'};utterance.onend=()=>{$('status').textContent='播放完毕。可重听或答题。'};utterance.onerror=e=>{$('status').textContent='播放未完成：'+e.error+'。请检查静音、音量及系统西语语音。'};$('status').textContent='正在启动……';speechSynthesis.speak(utterance)}async function copyText(){try{await navigator.clipboard.writeText(lessons[current].text);$('feedback').textContent='原文已复制。'}catch{$('feedback').textContent='请长按或选中原文复制。'}}$('mobile').onchange=e=>openLesson(+e.target.value);if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;Promise.resolve([{"title": "见面问好", "text": "Hola, ¿cómo estás? Muy bien, gracias. ¿Y vos? Bien. Me llamo Ana. Mucho gusto, Ana. Soy Luis.", "zh": "你好，你好吗？很好，谢谢。你呢？很好。我叫安娜。很高兴认识你，安娜。我是路易斯。", "vocab": ["cómo estás=你好吗", "vos=你，阿根廷等地常用", "mucho gusto=很高兴认识你"], "questions": [{"q": "女士叫什么？", "options": ["Ana", "Laura", "María"], "answer": 0}, {"q": "男士状态如何？", "options": ["饿了", "很好", "很累"], "answer": 1}]}, {"title": "来自哪里", "text": "¿De dónde sos? Soy de China. Ahora vivo acá. ¿Hablás español? Un poquito. Estoy aprendiendo.", "zh": "你来自哪里？我来自中国。现在住在这里。你会说西班牙语吗？一点点。我正在学。", "vocab": ["sos=是，vos的现在时", "acá=这里", "un poquito=一点点"], "questions": [{"q": "说话者来自哪里？", "options": ["秘鲁", "中国", "智利"], "answer": 1}, {"q": "西语程度如何？", "options": ["完全精通", "完全不会", "会一点"], "answer": 2}]}, {"title": "咖啡时间", "text": "Buen día. Quiero un café con leche, por favor. ¿Grande o chico? Chico, gracias. ¿Algo más? No, nada más.", "zh": "早上好。我想要一杯牛奶咖啡。大杯还是小杯？小杯，谢谢。还要别的吗？不用了。", "vocab": ["café con leche=牛奶咖啡", "chico=小的", "nada más=没有别的了"], "questions": [{"q": "点了什么？", "options": ["茶", "果汁", "牛奶咖啡"], "answer": 2}, {"q": "要多大杯？", "options": ["小杯", "大杯", "中杯"], "answer": 0}]}, {"title": "早餐", "text": "¿Qué querés comer? Quiero pan con queso. ¿Y para tomar? Un té, por favor. No quiero azúcar.", "zh": "你想吃什么？我要面包配奶酪。喝什么呢？请给我一杯茶。我不要糖。", "vocab": ["querés=想要，vos的现在时", "queso=奶酪", "azúcar=糖"], "questions": [{"q": "想吃什么？", "options": ["面包配奶酪", "米饭", "鱼"], "answer": 0}, {"q": "茶里不要什么？", "options": ["冰", "糖", "牛奶"], "answer": 1}]}, {"title": "买水", "text": "Hola, ¿tenés agua? Sí, con gas o sin gas. Sin gas, por favor. Quiero dos botellas. Acá tenés. Gracias.", "zh": "你好，有水吗？有，汽水还是无气水？无气水。我要两瓶。给你。谢谢。", "vocab": ["tenés=有，vos的现在时", "sin gas=无气的", "botella=瓶子"], "questions": [{"q": "买几瓶？", "options": ["三瓶", "两瓶", "一瓶"], "answer": 1}, {"q": "买哪种水？", "options": ["气泡水", "热水", "无气水"], "answer": 2}]}, {"title": "餐厅点餐", "text": "Buenas. ¿Qué me recomienda? El pollo con arroz está muy rico. Bueno, quiero eso. ¿Para tomar? Agua, por favor.", "zh": "你好。您推荐什么？鸡肉配米饭很好吃。好，我要那个。喝什么？请给我水。", "vocab": ["me recomienda=您向我推荐", "pollo=鸡肉", "rico=好吃的"], "questions": [{"q": "选了哪道菜？", "options": ["鱼配沙拉", "牛肉面", "鸡肉配米饭"], "answer": 2}, {"q": "喝什么？", "options": ["水", "咖啡", "啤酒"], "answer": 0}]}, {"title": "结账", "text": "Disculpe, la cuenta, por favor. Son doce mil pesos. ¿Puedo pagar con tarjeta? Sí, claro. Muchas gracias.", "zh": "打扰一下，请结账。一万二千比索。可以刷卡吗？当然可以。谢谢。", "vocab": ["la cuenta=账单", "pagar=付款", "tarjeta=卡；此处价格仅为练习虚构"], "questions": [{"q": "账单是多少？", "options": ["一万二千", "两千", "二万"], "answer": 0}, {"q": "想怎样付款？", "options": ["转账", "刷卡", "现金"], "answer": 1}]}, {"title": "找洗手间", "text": "Perdón, ¿dónde está el baño? Al fondo, a la derecha. ¿Por acá? Sí, seguí derecho. Gracias. De nada.", "zh": "不好意思，洗手间在哪里？在里面右边。这边吗？对，继续直走。谢谢。不客气。", "vocab": ["al fondo=在最里面", "a la derecha=向右", "seguí=继续，vos的命令式"], "questions": [{"q": "洗手间在哪边？", "options": ["楼上", "右边", "左边"], "answer": 1}, {"q": "接着该怎么走？", "options": ["返回", "下楼", "直走"], "answer": 2}]}, {"title": "打车去酒店", "text": "Hola, voy al hotel Central. ¿Tiene la dirección? Sí, acá está. ¿Está lejos? No, son diez minutos. Perfecto, gracias.", "zh": "你好，我去中央酒店。您有地址吗？有，在这里。远吗？不远，十分钟。好，谢谢。", "vocab": ["voy=我去", "dirección=地址", "lejos=远"], "questions": [{"q": "要去哪里？", "options": ["机场", "车站", "酒店"], "answer": 2}, {"q": "车程多久？", "options": ["十分钟", "三十分钟", "一小时"], "answer": 0}]}, {"title": "入住酒店", "text": "Buenas tardes. Tengo una reserva a nombre de Liang. Su pasaporte, por favor. Acá tiene. Su habitación es la doscientos cinco. Gracias.", "zh": "下午好。我有预订，名字是梁。请出示护照。给您。您的房间是205号。谢谢。", "vocab": ["reserva=预订", "a nombre de=以……名字", "habitación=房间"], "questions": [{"q": "需要出示什么？", "options": ["护照", "车票", "银行卡"], "answer": 0}, {"q": "房间号码？", "options": ["305", "205", "250"], "answer": 1}]}, {"title": "市场买水果", "text": "¿Cuánto sale el kilo de bananas? Dos mil pesos. Bueno, llevo un kilo. ¿Quiere una bolsa? Sí, por favor.", "zh": "香蕉一公斤多少钱？两千比索。好，我买一公斤。您要袋子吗？要，谢谢。", "vocab": ["cuánto sale=多少钱", "llevo=我买下", "bolsa=袋子；价格为练习虚构"], "questions": [{"q": "买了多少香蕉？", "options": ["半公斤", "一公斤", "两公斤"], "answer": 1}, {"q": "需要袋子吗？", "options": ["不需要", "没说", "需要"], "answer": 2}]}, {"title": "衣服尺寸", "text": "Me gusta esta remera. ¿Tenés una más grande? Sí, probá esta. Me queda bien. ¿Hay en azul? Sí, acá tenés.", "zh": "我喜欢这件T恤。有大一点的吗？有，试试这件。很合身。有蓝色吗？有，给你。", "vocab": ["remera=阿根廷等地称T恤", "probá=试试，vos的命令式", "me queda bien=我穿着合适"], "questions": [{"q": "需要什么尺寸？", "options": ["更小一点", "原来大小", "更大一点"], "answer": 2}, {"q": "想要什么颜色？", "options": ["蓝色", "红色", "白色"], "answer": 0}]}, {"title": "问公交", "text": "Perdón, ¿este colectivo va al centro? Sí, pero tenés que bajar en la plaza. ¿Son muchas paradas? No, son cuatro. Gracias.", "zh": "请问，这辆公交去市中心吗？是，不过你得在广场下车。很多站吗？不，四站。谢谢。", "vocab": ["colectivo=阿根廷等地的公交车", "bajar=下车", "parada=车站"], "questions": [{"q": "在哪里下车？", "options": ["广场", "酒店", "机场"], "answer": 0}, {"q": "有几站？", "options": ["六站", "四站", "两站"], "answer": 1}]}, {"title": "约个时间", "text": "¿Vamos a tomar un café mañana? Dale. ¿A qué hora? A las cuatro de la tarde. Nos vemos en la plaza. Perfecto, hasta mañana.", "zh": "明天去喝咖啡吗？好呀。几点？下午四点。我们在广场见。好，明天见。", "vocab": ["dale=好呀、行，拉普拉塔地区常用", "mañana=明天", "nos vemos=回头见"], "questions": [{"q": "什么时候见？", "options": ["明天上午十点", "明天下午四点", "今天四点"], "answer": 1}, {"q": "在哪里见？", "options": ["家里", "酒店", "广场"], "answer": 2}]}, {"title": "天气和出门", "text": "Hoy hace mucho calor. ¿Querés salir? Mejor más tarde. Ahora quiero tomar agua y descansar un rato. Bueno, salimos a las seis.", "zh": "今天很热。想出门吗？晚一点更好。现在我想喝水，休息一会儿。好，我们六点出门。", "vocab": ["hace calor=天气热", "más tarde=晚一点", "un rato=一会儿"], "questions": [{"q": "为什么晚点出门？", "options": ["下雪了", "没有车", "天气很热"], "answer": 2}, {"q": "几点出门？", "options": ["六点", "四点", "八点"], "answer": 0}]}, {"title": "请再说一次", "text": "Disculpe, no entiendo. ¿Puede repetir más despacio? Sí, claro. El museo abre a las nueve y cierra a las cinco. Ah, ahora entiendo. Gracias.", "zh": "对不起，我没听懂。可以再慢一点说吗？可以。博物馆九点开门，五点关门。啊，现在听懂了。谢谢。", "vocab": ["no entiendo=我不明白", "más despacio=更慢一点", "cierra=关门"], "questions": [{"q": "请求对方怎么说？", "options": ["慢一点再说", "大声唱", "用英语"], "answer": 0}, {"q": "几点关门？", "options": ["七点", "五点", "九点"], "answer": 1}]}, {"title": "找手机", "text": "No encuentro mi celular. ¿Está en tu mochila? No, no está. Mirá, está sobre la mesa, al lado del libro. Ah, sí. Muchas gracias.", "zh": "我找不到手机了。在你的背包里吗？不，不在。看，在桌子上，书旁边。啊，对。谢谢。", "vocab": ["celular=手机，拉美常用", "mochila=背包", "al lado de=在……旁边"], "questions": [{"q": "手机在哪里？", "options": ["椅子下", "桌子上", "背包里"], "answer": 1}, {"q": "旁边是什么？", "options": ["杯子", "钥匙", "书"], "answer": 2}]}, {"title": "周末小旅行", "text": "El sábado vamos a un pueblo cerca de la ciudad. Salimos a las ocho en colectivo. Primero caminamos por la plaza. Después comemos algo y volvemos por la tarde.", "zh": "星期六我们去城附近的小镇。八点坐公交出发。先在广场走走，然后吃点东西，下午回来。", "vocab": ["pueblo=小镇", "primero=首先", "después=然后", "volvemos=我们回来"], "questions": [{"q": "哪天出发？", "options": ["星期日", "星期五", "星期六"], "answer": 2}, {"q": "吃东西前做什么？", "options": ["在广场散步", "回城", "入住酒店"], "answer": 0}]}]).then(d=>{lessons=d;openLesson(0)}).catch(()=>{$('app').textContent='课程载入失败，请刷新重试。'});
</script></html>
